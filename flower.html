<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Purple Flower</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

  <main class="flower-page">

    <div id="particles" aria-hidden="true"></div>

    <header class="intro">
      <p>JUST FOR YOU</p>
      <h1>Watch it bloom.</h1>
    </header>

    <section class="garden">

      <div
        class="flower"
        id="flower"
        role="button"
        tabindex="0"
        aria-label="Purple flower. Tap the flower to blow it in the wind."
      >

        <div class="stem"></div>

        <div class="leaves">
          <div class="leaf leaf-left"></div>
          <div class="leaf leaf-right"></div>
          <div class="leaf leaf-left-bottom"></div>
        </div>

        <div class="flower-head">

          <div class="petals">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>
          </div>

          <div class="flower-center"></div>

        </div>
      </div>

      <div class="tap-hint">
        <span>✦</span>
        Tap the flower
        <span>✦</span>
      </div>

    </section>

    <footer class="bottom-message">
      <p>Some things are worth waiting for.</p>

      <a class="back-button" href="index.html">
        ← Back
      </a>
    </footer>

  </main>

  <script src="static/js/flower.js"></script>

</body>
</html>
