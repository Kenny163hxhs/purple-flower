<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>A Purple Flower For You</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 50%,
          #35105c 0%,
          #1d0635 35%,
          #0c0017 70%,
          #020005 100%);

      font-family: Georgia, "Times New Roman", serif;
      color: white;
    }

    .purple-glow {
      position: fixed;
      width: min(750px, 90vw);
      height: min(750px, 90vw);
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(190, 60, 255, 0.45),
          rgba(150, 40, 255, 0.25) 30%,
          rgba(105, 20, 190, 0.12) 50%,
          transparent 72%);

      filter: blur(35px);
      animation: purplePulse 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }

    .purple-glow-2,
    .purple-glow-3 {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .purple-glow-2 {
      width: 400px;
      height: 400px;
      max-width: 60vw;
      max-height: 60vw;
      left: 5%;
      top: 30%;
      background: radial-gradient(circle,
        rgba(220, 120, 255, 0.20),
        transparent 70%);
      filter: blur(50px);
      animation: floatingGlow 7s ease-in-out infinite;
    }

    .purple-glow-3 {
      width: 350px;
      height: 350px;
      max-width: 55vw;
      max-height: 55vw;
      right: 5%;
      bottom: 15%;
      background: radial-gradient(circle,
        rgba(140, 50, 255, 0.22),
        transparent 70%);
      filter: blur(50px);
      animation: floatingGlow2 9s ease-in-out infinite;
    }

    .flower-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .flower-frame-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;

      filter:
        hue-rotate(120deg)
        saturate(1.65)
        brightness(0.92)
        contrast(1.08)
        drop-shadow(0 0 10px rgba(190, 60, 255, 0.75))
        drop-shadow(0 0 30px rgba(150, 40, 255, 0.55))
        drop-shadow(0 0 65px rgba(110, 20, 255, 0.35));
    }

    .flower-frame {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .top-content {
      position: fixed;
      top: clamp(20px, 5vh, 40px);
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      animation: fadeDown 1.5s ease;
    }

    .small-text {
      font-family: Arial, sans-serif;
      font-size: clamp(8px, 1.5vw, 11px);
      letter-spacing: clamp(3px, 0.8vw, 7px);
      text-transform: uppercase;
      color: #d99aff;
      margin-bottom: 8px;
      text-shadow:
        0 0 8px #c05cff,
        0 0 20px #9b35ff,
        0 0 35px rgba(170, 60, 255, 0.8);
    }

    .top-content h1 {
      font-size: clamp(30px, 6vw, 65px);
      font-weight: 400;
      font-style: italic;
      color: white;
      line-height: 1;
      white-space: nowrap;
      text-shadow:
        0 0 8px #ffffff,
        0 0 15px #d36cff,
        0 0 35px #a52cff,
        0 0 60px rgba(150, 40, 255, 0.8);
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #e0a3ff;
      box-shadow:
        0 0 5px #e0a3ff,
        0 0 12px #bc4dff,
        0 0 25px #941fff;
      animation: floatParticle linear infinite;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center,
          transparent 30%,
          rgba(15, 0, 25, 0.15) 60%,
          rgba(5, 0, 10, 0.65) 100%);
    }

    .bottom-content {
      position: fixed;
      bottom: clamp(12px, 3vh, 25px);
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      z-index: 10;
      text-align: center;
      animation: fadeUp 2s ease;
    }

    .bottom-content p {
      color: #e9d0fa;
      font-size: clamp(12px, 2vw, 15px);
      font-style: italic;
      margin-bottom: 10px;
      text-shadow:
        0 0 8px #b84cff,
        0 0 18px rgba(150, 50, 255, 0.7);
    }

    .back-button {
      display: inline-block;
      padding:
        clamp(8px, 2vw, 10px)
        clamp(16px, 4vw, 22px);

      border-radius: 50px;
      border: 1px solid rgba(210, 145, 255, 0.5);
      background: rgba(85, 20, 130, 0.35);
      color: #f5e5ff;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: clamp(10px, 2vw, 12px);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(160, 50, 255, 0.25);
    }

    .back-button:hover {
      background: rgba(155, 50, 255, 0.35);
      border-color: rgba(230, 180, 255, 0.9);
      box-shadow:
        0 0 15px rgba(200, 80, 255, 0.7),
        0 0 35px rgba(160, 40, 255, 0.45);
    }

    @keyframes purplePulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.88);
        opacity: 0.55;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.12);
        opacity: 1;
      }
    }

    @keyframes floatingGlow {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(90px, -60px); }
    }

    @keyframes floatingGlow2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-70px, -40px); }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translate(-50%, -25px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translate(-50%, 20px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes floatParticle {
      from {
        transform: translateY(110vh) scale(0.5);
        opacity: 0;
      }

      10% { opacity: 1; }
      90% { opacity: 1; }

      to {
        transform: translateY(-10vh) scale(1.3);
        opacity: 0;
      }
    }

    @media (max-width: 900px) {
      .flower-frame-wrapper {
        transform: scale(0.90);
      }
    }

    @media (max-width: 600px) {
      .flower-frame-wrapper {
        transform: scale(0.72);
        width: 140%;
        height: 140%;
      }

      .top-content {
        top: 22px;
      }

      .top-content h1 {
        font-size: 32px;
      }

      .bottom-content {
        bottom: 12px;
      }

      .bottom-content p {
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {
      .flower-frame-wrapper {
        transform: scale(0.62);
        width: 155%;
        height: 155%;
      }

      .top-content h1 {
        font-size: 27px;
      }

      .bottom-content p {
        font-size: 11px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .flower-frame-wrapper {
        transform: scale(0.65);
        width: 150%;
        height: 150%;
      }

      .top-content {
        top: 10px;
      }

      .top-content h1 {
        font-size: 28px;
      }

      .bottom-content {
        bottom: 7px;
      }

      .bottom-content p {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="purple-glow"></div>
  <div class="purple-glow-2"></div>
  <div class="purple-glow-3"></div>

  <div class="top-content">
    <div class="small-text">Just for you</div>
    <h1>Watch it bloom.</h1>
  </div>

  <div class="flower-container">
    <div class="flower-frame-wrapper">
      <iframe
        class="flower-frame"
        src="https://dev-tanay.github.io/Animated-Flower/"
        title="Purple Animated Flower"
        loading="eager">
      </iframe>
    </div>
  </div>

  <div class="particles" id="particles"></div>

  <div class="vignette"></div>

  <div class="bottom-content">
    <p>Some things are worth waiting for.</p>

    <a class="back-button" href="index.html">
      ← Back
    </a>
  </div>

  <script>
    const particles = document.getElementById("particles");

    for (let i = 0; i < 65; i++) {
      const particle = document.createElement("span");

      particle.className = "particle";
      particle.style.left = Math.random() * 100 + "%";
      particle.style.animationDuration =
        (5 + Math.random() * 9) + "s";
      particle.style.animationDelay =
        (Math.random() * 10) + "s";

      const size = 1 + Math.random() * 3;

      particle.style.width = size + "px";
      particle.style.height = size + "px";

      particles.appendChild(particle);
    }
  </script>
<script src="static/js/flower.js"></script>
</body>
</html>
