<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Purple Flower</title>

    <link
        rel="stylesheet"
        href="static/css/style.css"
    >
</head>

<body>

    <main class="flower-page">

        <!-- Background particles -->
        <div id="particles"></div>


        <!-- Header -->
        <header class="intro">

            <p>JUST FOR YOU</p>

            <h1>
                Watch it bloom.
            </h1>

        </header>


        <!-- Flower Area -->
        <section class="garden">

            <div
                class="flower"
                id="flower"
                aria-label="Purple flower. Tap to blow the flower."
                role="button"
                tabindex="0"
            >

                <!-- Stem -->
                <div class="stem"></div>


                <!-- Leaves -->
                <div class="leaves">

                    <div
                        class="leaf leaf-left"
                    ></div>

                    <div
                        class="leaf leaf-right"
                    ></div>

                    <div
                        class="leaf leaf-left-bottom"
                    ></div>

                </div>


                <!-- Flower Head -->
                <div class="flower-head">

                    <div class="petals">

                        <div class="petal p1"></div>

                        <div class="petal p2"></div>

                        <div class="petal p3"></div>

                        <div class="petal p4"></div>

                        <div class="petal p5"></div>

                        <div class="petal p6"></div>

                        <div class="petal p7"></div>

                        <div class="petal p8"></div>

                    </div>


                    <!-- Center -->
                    <div class="flower-center"></div>

                </div>

            </div>


            <!-- Tap Hint -->
            <div class="tap-hint">

                <span>✦</span>

                Tap the flower

                <span>✦</span>

            </div>

        </section>


        <!-- Bottom -->
        <footer class="bottom-message">

            <p>
                Some things are worth waiting for.
            </p>


            <a
                class="back-button"
                href="index.html"
            >
                ← Back
            </a>

        </footer>

    </main>


    <!-- 2D Flower JavaScript -->
    <script src="static/js/flower.js"></script>

</body>

</html>
